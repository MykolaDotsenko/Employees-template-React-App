name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

      - name: Create release when this version is unpublished
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "${TAG}" --repo "${GH_REPOSITORY}" >/dev/null 2>&1; then
            echo "${TAG} is already released; nothing to do."
            exit 0
          fi

          awk -v version="${VERSION}" '
            $0 ~ "^## " version " " { capture=1; next }
            capture && $0 ~ "^## " { exit }
            capture { print }
          ' CHANGELOG.md > /tmp/release-notes.md

          if [ ! -s /tmp/release-notes.md ]; then
            echo "DayDock ${TAG}" > /tmp/release-notes.md
          fi

          if ! git rev-parse "${TAG}" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "DayDock ${TAG}" "${GITHUB_SHA}"
            git push origin "${TAG}"
          fi

          gh release create "${TAG}"             --repo "${GH_REPOSITORY}"             --verify-tag             --title "DayDock ${TAG}"             --notes-file /tmp/release-notes.md
