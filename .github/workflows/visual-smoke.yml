name: Visual Smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production app
        run: npm run build

      - name: Render desktop and mobile smoke screenshots
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p visual-smoke

          cat > dist/__visual-seed.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8" />
          <title>DayDock visual fixture</title>
          <script>
            const mode = new URLSearchParams(location.search).get("mode") ?? "mature";
            const now = new Date();
            const iso = (offsetMinutes = 0) =>
              new Date(now.getTime() + offsetMinutes * 60_000).toISOString();
            const dateKey = now.toISOString().slice(0, 10);
            const tomorrowKey = new Date(
              now.getTime() + 24 * 60 * 60 * 1000,
            ).toISOString().slice(0, 10);

            const tasks = {
              release: {
                id: "release",
                title: "Ship DayDock release",
                status: "today",
                estimateMinutes: 50,
                personId: null,
                deferUntil: null,
                recurrence: null,
                createdAt: iso(-180),
                completedAt: null,
              },
              qa: {
                id: "qa",
                title: "Verify mobile release flow",
                status: "today",
                estimateMinutes: 25,
                personId: null,
                deferUntil: null,
                recurrence: null,
                createdAt: iso(-150),
                completedAt: null,
              },
              followup: {
                id: "followup",
                title: "Ask Anna for final copy review",
                status: "later",
                estimateMinutes: null,
                personId: "anna",
                deferUntil: dateKey,
                recurrence: null,
                createdAt: iso(-120),
                completedAt: null,
              },
              later: {
                id: "later",
                title: "Explore richer install screenshots",
                status: "later",
                estimateMinutes: null,
                personId: null,
                deferUntil: tomorrowKey,
                recurrence: {
                  kind: "weekly",
                  anchorDate: tomorrowKey,
                },
                createdAt: iso(-90),
                completedAt: null,
              },
              done: {
                id: "done",
                title: "Review release checklist",
                status: "done",
                estimateMinutes: 20,
                personId: null,
                deferUntil: null,
                recurrence: null,
                createdAt: iso(-240),
                completedAt: iso(-60),
              },
            };

            const state = {
              tasks,
              taskOrder: ["release", "qa", "followup", "later", "done"],
              top3: ["release", "qa"],
              people: {
                anna: {
                  id: "anna",
                  name: "Anna",
                  context: "Final release copy and mobile feedback",
                  nextFollowUpDate: dateKey,
                  createdAt: iso(-1440),
                },
              },
              personOrder: ["anna"],
              focus: {
                active:
                  mode === "focus"
                    ? {
                        id: "focus-release",
                        taskId: "release",
                        startedAt: iso(-8),
                        durationMinutes: 50,
                        pausedAt: iso(-1),
                        accumulatedPauseMs: 0,
                      }
                    : null,
                history: [
                  {
                    id: "focus-done",
                    taskId: "done",
                    startedAt: iso(-95),
                    durationMinutes: 20,
                    pausedAt: null,
                    accumulatedPauseMs: 0,
                    endedAt: iso(-75),
                    outcome: "completed",
                  },
                ],
              },
              dayPlan: {
                dateKey,
                focusRoomMinutes: 150,
                startedAt: iso(-30),
              },
              calendar: {
                events: [
                  {
                    id: "calendar-design",
                    title: "Design sync",
                    startAt: iso(45),
                    endAt: iso(90),
                    allDay: false,
                    source: "ics",
                  },
                ],
                importedAt: iso(-20),
                sourceLabel: "work-calendar.ics",
              },
            };

            localStorage.setItem(
              "daydock:workspace",
              JSON.stringify({
                schemaVersion: 5,
                updatedAt: iso(),
                data: state,
              }),
            );
            const surface =
              new URLSearchParams(location.search).get("surface");
            location.replace(
              surface ? `/?__visualSurface=${encodeURIComponent(surface)}` : "/",
            );
          </script>
          HTML

          cat > dist/__visual-nav.js <<'JS'
          (() => {
            const surface = new URLSearchParams(location.search).get(
              "__visualSurface",
            );
            const label = {
              today: "Today",
              inbox: "Inbox",
              people: "People",
              review: "Review",
            }[surface];

            if (!label) return;

            let attempts = 0;
            const openSurface = () => {
              const button = document.querySelector(
                `nav[aria-label="Primary"] button[aria-label="${label}"]`,
              );

              if (button instanceof HTMLButtonElement) {
                button.click();
                return;
              }

              attempts += 1;
              if (attempts < 80) window.setTimeout(openSurface, 50);
            };

            window.addEventListener("DOMContentLoaded", openSurface, {
              once: true,
            });
          })();
          JS

          sed -i 's#</body>#<script src="./__visual-nav.js"></script></body>#' dist/index.html

          npm run preview -- --host 127.0.0.1 --port 4173 > visual-smoke/preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "${preview_pid}" 2>/dev/null || true' EXIT

          ready=false
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "${ready}" != "true" ]; then
            cat visual-smoke/preview.log
            echo "::error::Vite preview did not become ready."
            exit 1
          fi

          browser="$(
            command -v google-chrome ||
            command -v google-chrome-stable ||
            command -v chromium ||
            command -v chromium-browser ||
            true
          )"

          if [ -z "${browser}" ]; then
            echo "::error::No Chromium-compatible browser is available on the runner."
            exit 1
          fi

          common_flags=(
            --headless=new
            --no-sandbox
            --disable-dev-shm-usage
            --disable-gpu
            --disable-extensions
            --disable-breakpad
            --disable-crash-reporter
            --renderer-process-limit=2
            --disable-background-networking
            --disable-component-update
            --disable-default-apps
            --disable-domain-reliability
            --disable-sync
            --metrics-recording-only
            --no-first-run
            --disable-features=OptimizationHints,MediaRouter,Translate,AutofillServerCommunication,PushMessaging
            --hide-scrollbars
            --run-all-compositor-stages-before-draw
            --virtual-time-budget=2500
          )

          cleanup_chromium_profile() {
            local profile="$1"

            pkill -TERM -f -- "--user-data-dir=${profile}" 2>/dev/null || true
            sleep 0.2
            pkill -KILL -f -- "--user-data-dir=${profile}" 2>/dev/null || true
          }

          capture_screenshot() {
            local profile="$1"
            local size="$2"
            local output="$3"
            local url="$4"
            local attempt=1
            local status=0

            rm -f "${output}"

            while [ "${attempt}" -le 3 ]; do
              if [ "${attempt}" -gt 1 ]; then
                echo "::notice::Retrying screenshot ${attempt}/3 for ${url} with a clean Chromium profile."
                rm -rf "${profile}"
              fi

              status=0

              if timeout --kill-after=2s 20s "${browser}" "${common_flags[@]}" \
                --user-data-dir="${profile}" \
                --window-size="${size}" \
                --screenshot="${output}" \
                "${url}"; then
                status=0
              else
                status=$?
              fi

              cleanup_chromium_profile "${profile}"

              if [ -s "${output}" ]; then
                if [ "${status}" -eq 124 ]; then
                  echo "::notice::Chromium stayed alive after writing ${output}; accepting the rendered screenshot."
                fi
                return 0
              fi

              if [ "${status}" -ne 0 ] && [ "${status}" -ne 124 ] && [ "${status}" -ne 137 ]; then
                echo "::notice::Chromium screenshot attempt ${attempt} exited with status ${status}."
              fi

              attempt=$((attempt + 1))
            done

            echo "::error::Chromium produced no screenshot for ${url} after 3 attempts."
            return 1
          }

          dump_dom() {
            local profile="$1"
            local url="$2"
            local output="$3"
            local status=0

            if timeout --kill-after=2s 8s "${browser}" "${common_flags[@]}" \
              --user-data-dir="${profile}" \
              --dump-dom \
              "${url}" > "${output}"; then
              status=0
            else
              status=$?
            fi

            cleanup_chromium_profile "${profile}"

            if [ "${status}" -ne 0 ] && [ "${status}" -ne 124 ] && [ "${status}" -ne 137 ]; then
              echo "::error::Chromium DOM render failed for ${url} with status ${status}."
              return "${status}"
            fi

            if [ ! -s "${output}" ]; then
              echo "::error::Chromium produced no DOM for ${url}."
              return 1
            fi

            if [ "${status}" -eq 124 ]; then
              echo "::notice::Chromium stayed alive after producing DOM for ${url}; accepting the captured document and continuing assertions."
            fi
          }

          capture_screenshot \
            /tmp/daydock-desktop \
            1440,1100 \
            "$GITHUB_WORKSPACE/visual-smoke/desktop.png" \
            http://127.0.0.1:4173/

          capture_screenshot \
            /tmp/daydock-mobile \
            390,844 \
            "$GITHUB_WORKSPACE/visual-smoke/mobile.png" \
            http://127.0.0.1:4173/

          capture_screenshot \
            /tmp/daydock-small-mobile \
            360,740 \
            "$GITHUB_WORKSPACE/visual-smoke/small-mobile.png" \
            http://127.0.0.1:4173/

          dump_dom \
            /tmp/daydock-dom \
            http://127.0.0.1:4173/ \
            visual-smoke/dom.html

          capture_screenshot \
            /tmp/daydock-mature-desktop \
            1440,1100 \
            "$GITHUB_WORKSPACE/visual-smoke/mature-desktop.png" \
            "http://127.0.0.1:4173/__visual-seed.html?mode=mature"

          capture_screenshot \
            /tmp/daydock-mature-mobile \
            390,844 \
            "$GITHUB_WORKSPACE/visual-smoke/mature-mobile.png" \
            "http://127.0.0.1:4173/__visual-seed.html?mode=mature"

          capture_screenshot \
            /tmp/daydock-mature-small-mobile \
            360,740 \
            "$GITHUB_WORKSPACE/visual-smoke/mature-small-mobile.png" \
            "http://127.0.0.1:4173/__visual-seed.html?mode=mature"

          # Keep screenshot coverage to representative visual states. Individual
          # Inbox / People / Review interaction semantics are covered by RTL tests;
          # spawning a fresh Chromium process for every surface made hosted-runner
          # smoke checks flaky after several successful renders.
          capture_screenshot \
            /tmp/daydock-focus-desktop \
            1440,1100 \
            "$GITHUB_WORKSPACE/visual-smoke/focus-desktop.png" \
            "http://127.0.0.1:4173/__visual-seed.html?mode=focus"

          capture_screenshot \
            /tmp/daydock-focus-mobile \
            390,844 \
            "$GITHUB_WORKSPACE/visual-smoke/focus-mobile.png" \
            "http://127.0.0.1:4173/__visual-seed.html?mode=focus"

          dump_dom \
            /tmp/daydock-mature-dom \
            "http://127.0.0.1:4173/__visual-seed.html?mode=mature" \
            visual-smoke/mature-dom.html

          dump_dom \
            /tmp/daydock-focus-dom \
            "http://127.0.0.1:4173/__visual-seed.html?mode=focus" \
            visual-smoke/focus-dom.html

          grep -q "DayDock" visual-smoke/dom.html
          grep -q "Capture your first item" visual-smoke/dom.html
          grep -q "DayDock getting started" visual-smoke/dom.html
          grep -q "Ship DayDock release" visual-smoke/mature-dom.html
          grep -q "Top 3" visual-smoke/mature-dom.html
          grep -q "Ship DayDock release" visual-smoke/focus-dom.html
          grep -q "End session" visual-smoke/focus-dom.html

          test -s visual-smoke/desktop.png
          test -s visual-smoke/mobile.png
          test -s visual-smoke/small-mobile.png
          test -s visual-smoke/mature-desktop.png
          test -s visual-smoke/mature-mobile.png
          test -s visual-smoke/mature-small-mobile.png
          test -s visual-smoke/focus-desktop.png
          test -s visual-smoke/focus-mobile.png

          # Warm a real production profile so the generated service worker can
          # install and precache the built app shell before the network is removed.
          dump_dom \
            /tmp/daydock-offline \
            http://127.0.0.1:4173/ \
            visual-smoke/offline-warm-dom.html

          capture_screenshot \
            /tmp/daydock-offline \
            390,844 \
            "$GITHUB_WORKSPACE/visual-smoke/offline-warm-mobile.png" \
            http://127.0.0.1:4173/

          grep -q "DayDock" visual-smoke/offline-warm-dom.html
          test -s visual-smoke/offline-warm-mobile.png

          kill "${preview_pid}" 2>/dev/null || true
          wait "${preview_pid}" 2>/dev/null || true
          trap - EXIT

          # Reopen the same warmed browser profile with the preview server
          # stopped. If hashed JS/CSS were not precached this becomes a browser
          # error or an incomplete shell and the assertions below fail.
          rm -f visual-smoke/offline-mobile.png visual-smoke/offline-dom.html

          offline_status=0
          if timeout 15s "${browser}" "${common_flags[@]}" \
            --user-data-dir=/tmp/daydock-offline \
            --window-size=390,844 \
            --screenshot="$GITHUB_WORKSPACE/visual-smoke/offline-mobile.png" \
            http://127.0.0.1:4173/; then
            offline_status=0
          else
            offline_status=$?
          fi

          if [ "${offline_status}" -ne 0 ] && [ "${offline_status}" -ne 124 ]; then
            echo "::error::Offline Chromium screenshot failed with status ${offline_status}."
            exit "${offline_status}"
          fi

          test -s visual-smoke/offline-mobile.png

          offline_dom_status=0
          if timeout 15s "${browser}" "${common_flags[@]}" \
            --user-data-dir=/tmp/daydock-offline \
            --dump-dom \
            http://127.0.0.1:4173/ > visual-smoke/offline-dom.html; then
            offline_dom_status=0
          else
            offline_dom_status=$?
          fi

          if [ "${offline_dom_status}" -ne 0 ] && [ "${offline_dom_status}" -ne 124 ]; then
            echo "::error::Offline Chromium DOM render failed with status ${offline_dom_status}."
            exit "${offline_dom_status}"
          fi

          grep -q "DayDock" visual-smoke/offline-dom.html
          grep -q "Capture your first item" visual-smoke/offline-dom.html
          test -s visual-smoke/offline-dom.html

      - name: Upload visual smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daydock-visual-smoke
          path: visual-smoke/
          if-no-files-found: warn
          retention-days: 14
