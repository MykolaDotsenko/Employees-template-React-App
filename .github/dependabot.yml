version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Helsinki
    open-pull-requests-limit: 5
    groups:
      test-and-build-tooling:
        dependency-type: development
        patterns:
          - "@testing-library/*"
          - "@types/*"
          - "@vitejs/*"
          - "eslint*"
          - "typescript*"
          - "vite"
          - "vitest"
          - "globals"
      runtime:
        dependency-type: production
        patterns:
          - "react"
          - "react-dom"
          - "zod"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
